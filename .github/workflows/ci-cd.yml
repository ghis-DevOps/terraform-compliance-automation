name: "Compliance Infrastructure & CI/CD Pipeline"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Required permissions for OIDC token generation & PR comments
permissions:
  id-token: write # Required to request the JWT token from GitHub OIDC provider
  contents: read  # Required to checkout repository code
  pull-requests: write # Required to post plan output back to PRs

env:
  TF_VERSION: "1.6.0"
  AWS_REGION: "us-east-1"
  # Replace with your IAM Role ARN configured for GitHub Actions OIDC
  ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }} # e.g. arn:aws:iam::123456789012:role/github-actions-terraform-runner

jobs:
  terraform-ci:
    name: "Static Checks & Pre-Flight Validation"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Pre-Flight Shell Check
        run: |
          chmod +x ./scripts/enforce_policy.sh
          ./scripts/enforce_policy.sh

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false # Prevents deprecated set-output wrapper issues

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          hide-shortcut-and-summary: "false"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  terraform-plan:
    name: "AWS Authenticated Plan"
    needs: terraform-ci
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ------------------------------------------------------------------
      # AWS OIDC Authentication Step
      # ------------------------------------------------------------------
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraformPlanSession

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Post Plan Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Plan Status 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan Output</summary>

            \`\`\`hcl
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }} in PR #${{ github.event.number }}*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Check Plan Failure
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    name: "AWS Authenticated Apply"
    needs: terraform-ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ------------------------------------------------------------------
      # AWS OIDC Authentication Step
      # ------------------------------------------------------------------
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsTerraformApplySession

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false